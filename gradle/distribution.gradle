/** Central distribution provider for native, Modrinth and CurseForge artifacts. */
def selected = providers.gradleProperty("dist")
        .map { it.trim().toLowerCase(Locale.ROOT) }
        .orElse("native")
        .get()

def supported = ["native", "modrinth", "curseforge"]
if (!supported.contains(selected)) {
    throw new GradleException("Unsupported dist='${selected}'. Expected native, modrinth or curseforge.")
}

ext.distributionVariant = selected
ext.isNativeDist = selected == "native"
ext.isModrinthDist = selected == "modrinth"
ext.isCurseForgeDist = selected == "curseforge"
ext.distributionArchiveName = { String baseName ->
    selected == "native" ? "${baseName}.jar" : "${baseName}-${selected}.jar"
}
ext.distributionResourceExcludes = { spec ->
    spec.exclude 'natives/**'
    spec.exclude '**/*.dll'
    spec.exclude '**/*.so'
    spec.exclude '**/*.dylib'
    spec.exclude '**/*.jnilib'
    spec.exclude '**/*.exe'
}
ext.distributionSourceExcludes = { spec ->
    spec.exclude 'com/micaftic/morpher/RuntimeAccelerationLoader.java'
    spec.exclude 'com/micaftic/morpher/client/gui/resource/ResourceStationConfig.java'
    spec.exclude 'com/elfmcys/yesstevemodel/geckolib3/geo/render/built/ModelAccelerationBridge.java'
    spec.exclude 'com/ysm/parser/YSMParser.java'
    spec.exclude 'com/ysm/parser/YSMNative.java'
    spec.exclude 'com/micaftic/morpher/core/algorithms/YsmAlgorithmBridge.java'
}
tasks.register('printDistribution') {
    doLast { println "distribution=${rootProject.ext.distributionVariant}" }
}
