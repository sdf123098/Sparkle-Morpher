[general]
	#Whether to display disclaimer GUI
	DisclaimerShow = false
	#Whether to print animation roulette play message
	PrintAnimationRouletteMsg = false
	#Prevents rendering of self player's model
	DisableSelfModel = false
	#Prevents rendering of other player's model
	DisableOtherModel = false
	#Prevents rendering of self player's hand
	DisableSelfHands = false
	#Prevents rendering of projectile model
	DisableProjectileModel = false
	#Prevents rendering of vehicle model
	DisableVehicleModel = false
	#Disable first person animation from other mods.
	DisableExternalFirstPersonAnim = false
	#If rendering errors occur, try turning on this.
	UseCompatibilityRenderer = false
	#Test renderer.
	UseGpuRenderer = true
	#Render ysmGlow bones with normal entity lighting while a shader pack is active.
	DisableModelGlowInShaderpack = true
	#Allowed Values: ORIGINAL, CUSTOM
	RouletteContentMode = "ORIGINAL"
	#The amount of volume when the animation is played.
	# Default: 100.0
	# Range: 0.0 ~ 100.0
	SoundVolume = 100.0
	#Whether to display model ID first in the model selection screen, instead of the model name filled in by the model author.
	ShowModelIdFirst = false

[Integration]
	SophisticatedBackpack = true
	Parcool = true

[ExperimentalTesting]
	#Per-frame animation profiler for diagnosing animation stutter. Default off.
	AnimationFrameProfiler = false
	#Verbose per-evaluation [SM-ANIM] debug log. Very noisy, default off.
	AnimationDebugLog = false
	#Print [SM-INPUT] diagnostics for attack/use mouse clicks, key state, vanilla swing/use state, and local animation pulses.
	InputStateDebugLog = false
	#Warn when the same entity is fully evaluated more than once in a single render frame.
	WarnRepeatedAnimationEvaluation = true
	#Reduce animation update rates for distant entities. Disabled by default for smoother animation.
	AnimationDistanceLod = false
	#Verbose resource station network/probe logging. Default off.
	ResourceStationMonitorLog = false
	#Verbose client/server online model sync diagnostics. Default off.
	NetworkOnlineDebugLog = false
	#Model memory profiler for read/decrypt/parse/texture/GPU/LRU checkpoints. Default off.
	ModelMemoryProfiler = false
	#Print [SM][Perf] timing logs for model import, upload, and reload checkpoints. Default off.
	ModelImportPerformanceLog = false
	#Release Java texture byte arrays after successful GPU upload. Default off.
	ReleaseTextureBytesAfterUpload = false
	#Maximum models whose GPU/native render caches stay resident. 0 disables LRU trimming.
	# Default: 0
	# Range: 0 ~ 512
	MaxCachedGpuModels = 0
	#Minimum idle time before GPU/native render caches can be trimmed.
	# Default: 300
	# Range: 30 ~ 86400
	UnusedModelTtlSeconds = 300

[extra_player_render]
	#Whether to display player
	DisablePlayerRender = false
	#Player position x in screen
	# Default: 10
	# Range: > 0
	PlayerPosX = 10
	#Player position y in screen
	# Default: 10
	# Range: > 0
	PlayerPosY = 10
	#Player scale in screen
	# Default: 40.0
	# Range: 8.0 ~ 360.0
	PlayerScale = 40.0
	#Player yaw offset in screen
	# Default: 0.0
	# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
	PlayerYawOffset = 0.0

[loading_state_screen]
	#Whether to disable loading state screen
	DisableLoadingStateScreen = false
	#Loading state screen position
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	LoadingStatePosition = "TOP_CENTER"
