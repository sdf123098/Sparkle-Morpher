plugins {
    // Both loader toolchains are declared here and only applied by the subproject
    // that owns them: fabric-loom for :fabric, moddev for :neoforge.
    // They cannot share a single Gradle project, but they co-exist in one build.
    id 'fabric-loom' version '1.17.0-alpha.8' apply false
    id 'com.gradleup.shadow' version '9.0.0-beta4' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

apply from: rootProject.file('gradle/distribution.gradle')

// JVM tests use heap-backed JOML operations and need no internal Unsafe access.
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    tasks.withType(Test).configureEach {
        systemProperty 'joml.nounsafe', 'true'
    }
}

// ---------------------------------------------------------------------------
// Fabric-side project. The shared `common/` layer is compiled straight into each
// loader's compile unit (see each build.gradle), so there is no :common project.
// ---------------------------------------------------------------------------
configure([project(':fabric')]) {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = rootProject.archives_name
    }

    repositories {
        mavenLocal()
        mavenCentral()
        flatDir {
            dirs rootProject.file('libs')
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/releases"
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev"
        }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "FabricMC"
            url = "https://maven.fabricmc.net/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            mappings rootProject.file("fabric/mappings/mapping.tiny")
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.compilerArgs.addAll([
                '-Xlint:deprecation', '-Xlint:unchecked',
                // S18.7 restored javac diagnostics; warnings are tracked by stable fingerprints.
                '--add-modules', 'jdk.incubator.vector',
                '-Xmaxerrs', '10000',
                '-Xmaxwarns', '10000'
        ])
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

// :neoforge declares its own java {} block + compiler args inside its build.gradle:
// the `java` plugin is applied there, so configuring it from the root would run
// before the plugin exists.

// CurseForge variants drop native binaries from every resource-processing task.
subprojects {
    afterEvaluate {
        tasks.withType(ProcessResources).configureEach {
            if (rootProject.ext.isCurseForgeDist) {
                rootProject.ext.distributionResourceExcludes(delegate)
            }
        }
    }
}
