plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.gradleup.shadow' version '8.3.10' apply false
}

architectury {
    minecraft = project.minecraft_version
}

apply from: rootProject.file('gradle/distribution.gradle')

// JVM tests use heap-backed JOML operations and need no internal Unsafe access.
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'joml.nounsafe', 'true'
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Symmetric multi-loader layout: only :fabric runs the Architectury/Loom toolchain,
// :neoforge runs ModDevGradle from its own build script. Everything else that both
// loader modules share is configured here.
configure([project(':fabric')]) {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // The fabric jar is renamed in fabric/build.gradle to
        // sparkle-morpher-<ver>-fa1.21.1.jar; the shared layer is compiled straight
        // into this module, so there is no intermediate :common artifact any more.
        archivesName = "$rootProject.archives_name-fa1.21.1"
    }

    repositories {
        flatDir {
            dirs rootProject.file('libs')
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroup "org.spongepowered"
            }
        }
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/releases"
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
            content {
                includeGroup "com.terraformersmc"
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // withSourcesJar() removed: avoids architectury-loom Mercury dependency source-remap
        // failure (javax.annotation.Nullable via com.mojang.serialization.Dynamic on clean builds),
        // and aligns with the slimming plan (do not publish -sources jars).
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:deprecation', '-Xlint:unchecked',
                // S18.7 restored javac diagnostics; warnings are tracked by stable fingerprints.
                '--add-modules', 'jdk.incubator.vector'
        ])
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }

    afterEvaluate {
        tasks.withType(ProcessResources).configureEach {
            if (rootProject.ext.isCurseForgeDist) {
                rootProject.ext.distributionResourceExcludes(delegate)
            }
        }
    }
}
