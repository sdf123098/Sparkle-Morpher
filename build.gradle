plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

version = mod_version
group = maven_group

apply from: rootProject.file('gradle/distribution.gradle')
def isCurseForgeDist = rootProject.ext.isCurseForgeDist

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.creeperhost.net' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

base {
    archivesName = "sparkle-morpher-${project.version}-neo1.21.1"
}

tasks.named("jar") {
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-neo1.21.1")
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java {
    srcDir 'common/src/main/java'
    srcDir 'src/neoforge/java'
    if (!isCurseForgeDist) {
        srcDir rootProject.ext.distributionNativeJavaSourceDir
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('common/src/main/java'),
                fileTree('src/neoforge/java'),
                fileTree('src/curseforge/java')
        )
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Optional at runtime. Used only to compile the TaCZ 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:OypNE65K:wPvGWIj9"
    // Optional at runtime. Used only to compile the SlashBlade 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:8T53F0sy:u02EDgAr"
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    jarJar "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // R0: JVM 单测（JUnit 5），测试代码在 src/test/java。
    // moddev 将 MC 依赖链剥离出 test 运行时：neoforge + minecraft-dependencies（gson/joml/fastutil 等库）
    // + moddev 生成的 MC 类 jar（接口签名引用 MC 类需要）。
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.neoforged:neoforge:$neoforge_version"
    testImplementation "net.neoforged:minecraft-dependencies:$minecraft_version"
    // ModDev generates the merged client/server classes during the build; include them
    // explicitly so clean CI test runs can resolve client-only Minecraft classes.
    def mergedNeoForgeTestJar = layout.buildDirectory.file(
            "moddev/artifacts/neoforge-${neoforge_version}-merged.jar")
    testRuntimeOnly files(mergedNeoForgeTestJar)
    testRuntimeOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('createMinecraftArtifacts')
    doFirst {
        // The generated merged jar is created during the build; attach it at execution
        // time so a clean Linux CI checkout includes client-only Minecraft classes.
        classpath += files(fileTree("build/moddev/artifacts") {
            include "neoforge-*-merged.jar"
        })
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    def expandProps = [
            'version'               : mod_version,
            'mc_version'            : minecraft_version,
            'neoforge_version'      : neoforge_version,
            'mod_id'                : mod_id,
            'loader_version_range'  : loader_version_range,
            'neoforge_version_range': neoforge_version_range,
    ]

    inputs.properties expandProps

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }

    if (isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}
