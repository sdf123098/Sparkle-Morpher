plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

version = mod_version
group = maven_group

apply from: rootProject.file('gradle/distribution.gradle')
def isCurseForgeDist = rootProject.ext.isCurseForgeDist

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.creeperhost.net' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

base {
    archivesName = "sparkle-morpher-${project.version}-neo1.21.1"
}

tasks.named("jar") {
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-neo1.21.1")
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // ModDevGradle must own the test classpath and the generated Minecraft
    // artifacts.  A plain Gradle test source set otherwise compiles before
    // createMinecraftArtifacts on a clean CI runner.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.java {
    srcDir 'common/src/main/java'
    srcDir 'src/neoforge/java'
    if (!isCurseForgeDist) {
        srcDir rootProject.ext.distributionNativeJavaSourceDir
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('common/src/main/java'),
                fileTree('src/neoforge/java'),
                fileTree('src/curseforge/java')
        )
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Optional at runtime. Used only to compile the TaCZ 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:OypNE65K:wPvGWIj9"
    // Optional at runtime. Used only to compile the SlashBlade 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:8T53F0sy:u02EDgAr"
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    jarJar "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // R0: JVM 单测（JUnit 5），测试代码在 src/test/java。
    // Minecraft / NeoForge 类路径由 neoForge.unitTest 统一管理，避免同时
    // 注入普通和 merged 工件而在测试启动时产生重复类。
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    def expandProps = [
            'version'               : mod_version,
            'mc_version'            : minecraft_version,
            'neoforge_version'      : neoforge_version,
            'mod_id'                : mod_id,
            'loader_version_range'  : loader_version_range,
            'neoforge_version_range': neoforge_version_range,
    ]

    inputs.properties expandProps

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }

    if (isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}
