# One MC version per repository: this file is the single source of version truth for
# both loader subprojects (:fabric and :neoforge).
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

# Mod properties (shared)
mod_id=sparkle_morpher
mod_name=Sparkle's Morpher
mod_version = 2.3.3
maven_group = com.micaftic
mod_group_id=com.micaftic
archives_name = sparkle-morpher
mod_authors=Micaftic
mod_license=MIT
mod_description=Sparkle's Morpher (\u82b1\u706b\u706b\u7684\u53d8\u8eab\u5668) - Custom player model system for Minecraft. Based on OpenYSM (MIT).

# Minecraft properties (shared)
minecraft_version = 26.2

# Fabric dependencies
fabric_loader_version = 0.19.3
fabric_api_version = 0.153.0+26.2
forge_config_api_port_version = 26.2.1
forge_config_api_port_curse_file_id = 8292030
cardinal_components_version = 8.0.0
modmenu_version = 18.0.0-beta.1

# NeoForge dependencies
neo_version=26.2.0.11-beta
neoForge.neoFormRuntime.launcherManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
neoForge.neoFormRuntime.enableCache=true
neoForge.neoFormRuntime.useEclipseCompiler=true
