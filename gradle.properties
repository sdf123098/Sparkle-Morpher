# Done to increase the memory available to Gradle. The NeoForge toolchain needs
# more headroom than the Fabric one, so the merged build uses the larger budget.
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

# Mod properties (shared by both loaders)
mod_id=sparkle_morpher
mod_name=Sparkle's Morpher
mod_version = 2.3.3
maven_group = com.micaftic
mod_group_id=com.micaftic
archives_name = sparkle-morpher
mod_authors=Micaftic
mod_license=MIT
mod_description=Sparkle's Morpher (\u82b1\u706b\u706b\u7684\u53d8\u8eab\u5668) - Custom player model system for Minecraft. Based on OpenYSM (MIT).

# Minecraft properties
minecraft_version = 26.1.2

# Fabric dependencies
# Match the minimum dependency versions of TaCZ Refabricated R3-hotfix2.
fabric_loader_version = 0.19.3
fabric_api_version = 0.155.2+26.1.2
# Modrinth ID pins the Fabric build of Forge Config API Port 26.1.5.
forge_config_api_port_version = jUe0ucoE
cardinal_components_version = 8.0.0
modmenu_version = 18.0.0-beta.1

# NeoForge dependencies
neo_version=26.1.2.70-beta
neoForge.neoFormRuntime.launcherManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
neoForge.neoFormRuntime.enableCache=true
neoForge.neoFormRuntime.useEclipseCompiler=true
