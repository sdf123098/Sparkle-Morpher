plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

group = mod_group_id
version = mod_version

apply from: rootProject.file('gradle/distribution.gradle')

def isCurseForgeDist = rootProject.ext.isCurseForgeDist

base {
    archivesName = "sparkle-morpher-${project.version}-neo${rootProject.minecraft_version}"
}

tasks.named('jar') {
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-neo${rootProject.minecraft_version}")
}

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.creeperhost.net' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
    flatDir { dirs 'libs' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Symmetric loader layout: `common/` is the shared source layer at the repo root,
// this module owns src/{main,native,curseforge,test}/ exactly like :fabric does.
// `src/main/resources` holds only loader-specific files plus the few images that
// differ from the Fabric build (the rest is inherited from common/).
// The two variant roots are mutually exclusive: native builds compile the native
// layer, CurseForge builds compile the CurseForge layer instead.
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
            if (isCurseForgeDist) {
                srcDir rootProject.file('common/src/curseforge/java')
                srcDir file('src/curseforge/java')
            } else {
                srcDir rootProject.file('common/src/native/java')
                srcDir file('src/native/java')
            }
        }
        resources {
            srcDir 'src/generated/resources'
            srcDir rootProject.file('common/src/main/resources')
            exclude 'native/**'
        }
    }
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll([
            '-Xlint:deprecation', '-Xlint:unchecked',
            // S18.7 restored javac diagnostics; warnings are tracked by stable fingerprints.
            '--add-modules', 'jdk.incubator.vector'
    ])
}

processResources {
    def expandProps = [
            'version'               : mod_version,
            'mc_version'            : minecraft_version,
            'neoforge_version'      : neoforge_version,
            'mod_id'                : mod_id,
            'loader_version_range'  : loader_version_range,
            'neoforge_version_range': neoforge_version_range,
    ]

    inputs.properties expandProps

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    from(rootProject.file('LICENSE.txt')) {
        rename { 'LICENSE' }
    }

    if (isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}

dependencies {
    // Optional at runtime. Used only to compile the TaCZ 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:OypNE65K:wPvGWIj9"
    // Optional at runtime. Used only to compile the SlashBlade 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:8T53F0sy:u02EDgAr"
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    jarJar "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // R0: JVM 单测（JUnit 5），测试代码在 common/src/test/java。
    // Plain Gradle test source set (not neoForge.unitTest): the suite is a pure
    // JVM contract suite that must not boot ModLauncher, because booting it
    // requires every declared mixin config to resolve at runtime.
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.neoforged:neoforge:$neoforge_version"
    testImplementation "net.neoforged:minecraft-dependencies:$minecraft_version"
    testCompileOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
    testCompileOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
}

test {
    useJUnitPlatform()
    // The suite loads Minecraft; keep room for the texture decoder's heap reserve.
    maxHeapSize = '1G'
    // Patched MC chat/enums consult FMLLoader even in plain JVM tests.
    classpath += sourceSets.main.runtimeClasspath
}

tasks.register("printRepositories") {
    doLast {
        repositories.eachWithIndex { repo, index ->
            println "${index}: ${repo.name} -> ${repo.hasProperty('url') ? repo.url : ''}"
        }
    }
}

apply from: rootProject.file('gradle/verify-distribution.gradle')
