plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

group = mod_group_id
version = mod_version

apply from: rootProject.file('gradle/distribution.gradle')

def isCurseForgeDist = rootProject.ext.isCurseForgeDist

base {
    archivesName = "sparkle-morpher-${project.version}-neo26.1.x"
}

tasks.named('jar') {
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-neo26.1.x")
}

repositories {
    maven { url = "https://jitpack.io" }
    mavenCentral()

    def projectLocalMaven = maven {
        name = "Project Local Maven"
        url = uri("local-maven")
    }
    remove(projectLocalMaven)
    add(0, projectLocalMaven)

    maven {
        name = "BMCLAPI Minecraft Libraries"
        url = "https://bmclapi2.bangbang93.com/maven"
    }
    maven {
        name = "Aliyun Public"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "Aliyun Central"
        url = "https://maven.aliyun.com/repository/central"
    }
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

["BMCLAPI Minecraft Libraries", "Aliyun Central", "Aliyun Public", "Project Local Maven", "NeoForged"].each { repoName ->
    def repo = repositories.findByName(repoName)
    if (repo != null) {
        repositories.remove(repo)
        repositories.add(0, repo)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

neoForge {
    enable {
        version = neo_version
        disableRecompilation = true
    }

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }

        server {
            server()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
            programArgument "--nogui"
        }

        data {
            data()
            programArguments.addAll "--mod", mod_id, "--all", "--output", file("src/generated/resources").absolutePath, "--existing", file("src/main/resources").absolutePath
        }
    }

    mods {
        yes_steve_model {
            sourceSet sourceSets.main
        }
    }
}

// Symmetric loader layout: `common/` is the shared source layer at the repo root,
// this module owns src/{main,native,curseforge,test}/ exactly like :fabric does.
// `src/main/resources` holds only loader-specific files plus the few images that
// differ from the Fabric build (the rest is inherited from common/).
// The two variant roots are mutually exclusive: native builds compile the native
// layer, CurseForge builds compile the CurseForge layer instead.
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
            if (isCurseForgeDist) {
                srcDir rootProject.file('common/src/curseforge/java')
                srcDir file('src/curseforge/java')
            } else {
                srcDir rootProject.file('common/src/native/java')
                srcDir file('src/native/java')
            }
        }
        resources {
            srcDir "src/generated/resources"
            srcDir rootProject.file('common/src/main/resources')
            exclude 'native/**'
        }
    }
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    options.compilerArgs.addAll([
            '-Xlint:deprecation', '-Xlint:unchecked',
            // S18.7 restored javac diagnostics; warnings are tracked by stable fingerprints.
            "--add-modules", "jdk.incubator.vector",
            "-Xmaxerrs", "10000",
            "-Xmaxwarns", "10000"
    ])
}

processResources {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }

    from(rootProject.file("LICENSE")) {
        rename { "LICENSE" }
    }

    if (isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}

dependencies {
    // zstd-jni is not used: the project relies on YSM native / pure-Java ZstdUtil / raw-frame fallback.
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    jarJar "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // R0: JVM unit tests (JUnit 5). moddev keeps MC deps out of the test runtime, so
    // declare neoforge + minecraft-dependencies + the generated MC class jars.
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testCompileOnly files(sourceSets.main.compileClasspath)
    testImplementation "net.neoforged:neoforge:$neo_version"
    testImplementation "net.neoforged:minecraft-dependencies:$minecraft_version"
    testRuntimeOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
    // MC classes are also needed on the test compile classpath so render-context
    // tests can reference types such as net.minecraft.world.entity.Entity.
    testCompileOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
}

test {
    useJUnitPlatform()
    // Patched MC chat/enums consult FMLLoader even in plain JVM tests.
    // Use the game's resolved runtime so loader versions follow NeoForge.
    classpath += sourceSets.main.runtimeClasspath
}

// The Fabric module ships a shadowed release; NeoForge's jar task is the release
// artifact, so both loaders expose the same `check` gate from one shared script.

tasks.register("printRepositories") {
    doLast {
        repositories.eachWithIndex { repo, index ->
            println "${index}: ${repo.name} -> ${repo.hasProperty('url') ? repo.url : ''}"
        }
    }
}

apply from: rootProject.file('gradle/verify-distribution.gradle')
