# SparkleMorpher 1.2.x §10 CI / Regression Gate
# 同一份模板同步到八分支（作为 §4.6 同步清单的一部分维护）。
# 每分支独立 job：common tests（含依赖方向边界测试）→ compile → build → artifact smoke。
name: CI

on:
  push:
    branches: [main, fa26.1.2, fa26.2, fa26.3, neo1.21.1, neo26.1.2, neo26.2, neo26.3]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ci-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            diagnostic_branch: fa1.21.1
            java: '21.0.12'
            compile_task: ':fabric:compileJava'
            gradle_task: ':fabric:build'
            jar_glob: 'fabric/build/libs/sparkle-morpher-*-fa1.21.1.jar'
            mod_meta: 'fabric.mod.json'
          - branch: fa26.1.2
            diagnostic_branch: fa26.1.2
            java: '25.0.4'
            compile_task: ':fabric:compileJava'
            gradle_task: ':fabric:build'
            jar_glob: 'fabric/build/libs/sparkle-morpher-*-fa26.1.x.jar'
            mod_meta: 'fabric.mod.json'
          - branch: fa26.2
            diagnostic_branch: fa26.2
            java: '25.0.4'
            compile_task: ':fabric:compileJava'
            gradle_task: ':fabric:build'
            jar_glob: 'fabric/build/libs/sparkle-morpher-*-fa26.2.jar'
            mod_meta: 'fabric.mod.json'
          - branch: fa26.3
            diagnostic_branch: fa26.3
            java: '25.0.4'
            compile_task: ':fabric:compileJava'
            gradle_task: ':fabric:build'
            jar_glob: 'fabric/build/libs/sparkle-morpher-*-fa26.3.jar'
            mod_meta: 'fabric.mod.json'
          - branch: neo1.21.1
            diagnostic_branch: neo1.21.1
            java: '21.0.12'
            compile_task: 'compileJava'
            gradle_task: ':build'
            jar_glob: 'build/libs/sparkle-morpher-*-neo1.21.1.jar'
            mod_meta: 'META-INF/neoforge.mods.toml'
          - branch: neo26.1.2
            diagnostic_branch: neo26.1.2
            java: '25.0.4'
            compile_task: 'compileJava'
            gradle_task: ':build'
            jar_glob: 'build/libs/sparkle-morpher-*-neo26.1.x.jar'
            mod_meta: 'META-INF/neoforge.mods.toml'
          - branch: neo26.2
            diagnostic_branch: neo26.2
            java: '25.0.4'
            compile_task: 'compileJava'
            gradle_task: ':build'
            jar_glob: 'build/libs/sparkle-morpher-*-neo26.2.jar'
            mod_meta: 'META-INF/neoforge.mods.toml'
          - branch: neo26.3
            diagnostic_branch: neo26.3
            java: '25.0.4'
            compile_task: 'compileJava'
            gradle_task: ':build'
            jar_glob: 'build/libs/sparkle-morpher-*-neo26.3.jar'
            mod_meta: 'META-INF/neoforge.mods.toml'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Grant gradlew executable bit
        run: chmod +x gradlew

      - name: Compile and compare native javac baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          ./gradlew ${{ matrix.compile_task }} --rerun-tasks --no-build-cache --no-daemon --console=plain 2>&1 | tee build/ci-diagnostics/native-compile.log
          pwsh -NoProfile -File scripts/check-javac-warning-fingerprints.ps1 \
            -LogPath build/ci-diagnostics/native-compile.log \
            -RepoRoot "$GITHUB_WORKSPACE" \
            -Branch '${{ matrix.diagnostic_branch }}' \
            -Dist native \
            -Task '${{ matrix.compile_task }}' \
            -BaselinePath gradle/diagnostic-warning-baselines.json \
            -SnapshotPath build/ci-diagnostics/native-snapshot.json

      - name: Compile and compare CurseForge javac baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          ./gradlew -Pdist=curseforge ${{ matrix.compile_task }} --rerun-tasks --no-build-cache --no-daemon --console=plain 2>&1 | tee build/ci-diagnostics/curseforge-compile.log
          pwsh -NoProfile -File scripts/check-javac-warning-fingerprints.ps1 \
            -LogPath build/ci-diagnostics/curseforge-compile.log \
            -RepoRoot "$GITHUB_WORKSPACE" \
            -Branch '${{ matrix.diagnostic_branch }}' \
            -Dist curseforge \
            -Task '${{ matrix.compile_task }}' \
            -BaselinePath gradle/diagnostic-warning-baselines.json \
            -SnapshotPath build/ci-diagnostics/curseforge-snapshot.json

      - name: Build and verify final artifact (${{ matrix.gradle_task }})
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --console=plain
        env:
          CI: 'true'

      - name: Native artifact smoke — exact final JAR
        shell: bash
        run: |
          set -eu
          NATIVE_GLOB='${{ matrix.jar_glob }}'
          mapfile -t jars < <(compgen -G "$NATIVE_GLOB" || true)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected one native final JAR for ${{ matrix.branch }}, found ${#jars[@]}: $NATIVE_GLOB"
            exit 1
          fi
          JAR="${jars[0]}"
          echo "smoke jar: $JAR"
          unzip -Z1 "$JAR" | grep -Fxq 'com/micaftic/morpher/YesSteveModel.class' \
            || { echo "::error::missing YesSteveModel.class in $JAR"; exit 1; }
          unzip -Z1 "$JAR" | grep -Fxq '${{ matrix.mod_meta }}' \
            || { echo "::error::missing ${{ matrix.mod_meta }} in $JAR"; exit 1; }
          unzip -Z1 "$JAR" | grep -Fxq 'natives/windows-x64/ysm-core.dll' \
            || { echo "::error::missing natives in $JAR"; exit 1; }
          unzip -Z1 "$JAR" | grep -Fxq 'native-manifest.json' \
            || { echo "::error::missing native-manifest.json in $JAR"; exit 1; }
          echo "native smoke OK"

      - name: Modrinth alias contract — uses native distribution
        shell: bash
        run: |
          set -eu
          ./gradlew -Pdist=modrinth printDistribution --no-daemon --console=plain | tee modrinth-distribution.txt
          grep -q '^distribution=native$' modrinth-distribution.txt

      - name: CurseForge variant build
        run: ./gradlew ${{ matrix.gradle_task }} -Pdist=curseforge --no-daemon --console=plain

      - name: CurseForge artifact smoke — exact final JAR and no native payload
        shell: bash
        run: |
          set -eu
          NATIVE_GLOB='${{ matrix.jar_glob }}'
          CURSEFORGE_GLOB="${NATIVE_GLOB%.jar}-curseforge.jar"
          mapfile -t jars < <(compgen -G "$CURSEFORGE_GLOB" || true)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected one CurseForge final JAR for ${{ matrix.branch }}, found ${#jars[@]}: $CURSEFORGE_GLOB"
            exit 1
          fi
          JAR="${jars[0]}"
          unzip -Z1 "$JAR" | grep -Fxq '${{ matrix.mod_meta }}' \
            || { echo "::error::missing ${{ matrix.mod_meta }} in $JAR"; exit 1; }
          if unzip -Z1 "$JAR" | grep -Eq '^(natives/|native-manifest\.json$|.*\.(dll|so|dylib|jnilib|exe)$)'; then
            echo "::error::CurseForge JAR contains native payload: $JAR"
            exit 1
          fi
          echo "CurseForge smoke OK: $JAR"

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch }}-jars
          path: |
            ${{ matrix.jar_glob }}
            **/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore
