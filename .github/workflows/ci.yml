name: CI

on:
  push:
    branches: [main, fa26.1.2, fa26.2, fa26.3, neo1.21.1, neo26.1.2, neo26.2, neo26.3]
  pull_request:
    branches: [main, fa26.1.2, fa26.2, fa26.3, neo1.21.1, neo26.1.2, neo26.2, neo26.3]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('.github/ci-matrix.json').read_text())
          event = os.environ['EVENT']
          if event in ('push', 'pull_request'):
              branch = os.environ['BASE_REF'] if event == 'pull_request' else os.environ['REF_NAME']
              rows = [r for r in rows if r['branch'] == branch]
              assert len(rows) == 1, f'Unregistered build branch: {branch}'
              rows[0]['ref'] = os.environ['COMMIT']
          else:
              for row in rows:
                  row['ref'] = row['branch']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
          PY

  build:
    needs: plan
    name: ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      BUILD_TASK: ${{ matrix.gradle_task }}
      COMPILE_TASK: ${{ matrix.compile_task }}
      DIAGNOSTIC_BRANCH: ${{ matrix.diagnostic_branch }}
      JAR_GLOB: ${{ matrix.jar_glob }}
      MOD_META: ${{ matrix.mod_meta }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build, test and audit native and CurseForge variants
        run: bash scripts/ci-build.sh
      - name: Upload both final JARs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.branch }}-jars
          path: |
            ${{ matrix.jar_glob }}
            ${{ matrix.curseforge_glob }}
          if-no-files-found: error
      - name: Upload diagnostic logs and both test suites
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.branch }}-diagnostics
          path: |
            build/ci-diagnostics/
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: warn
