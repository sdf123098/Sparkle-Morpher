architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    // Classic Architectury multi-module layout: common 模块独立编译（:common:compileJava），
    // 必须自己声明 AW，否则 common 里对 access-widened 成员的直调在编译期仍是 protected。
    accessWidenerPath = file('../fabric/src/main/resources/sparkle_morpher.accesswidener')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

test {
    useJUnitPlatform()
}

if (rootProject.ext.isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('src/main/java') {
                    exclude 'com/micaftic/morpher/RuntimeAccelerationLoader.java'
                    exclude 'com/micaftic/morpher/client/gui/resource/ResourceStationConfig.java'
                    exclude 'com/elfmcys/yesstevemodel/geckolib3/geo/render/built/ModelAccelerationBridge.java'
                    exclude 'com/ysm/parser/YSMParser.java'
                    exclude 'com/ysm/parser/YSMNative.java'
                    exclude 'com/micaftic/morpher/core/algorithms/YsmAlgorithmBridge.java'
                },
                fileTree('src/curseforge/java')
        )
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // R0: JVM 单测（JUnit 5），测试代码在 common/src/test/java，仅依赖核心纯 Java 类。
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Architectury API common artifact — 提供 Event<>、ClientLifecycleEvent、PlayerEvent 等抽象事件类型。
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Forge Config API Port — 让 common 在编译期看到 net.minecraftforge.common.ForgeConfigSpec 等类。
    // 运行时不绑定：Forge 平台由 Forge 自身提供这些类，Fabric 平台由 fabric 子项目的 modImplementation 引入 port。
    modCompileOnly "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"

    // ImageStream — 用于 avif/webp/jpeg 解码。运行时由 forge 子项目通过 jar-in-jar 内嵌。
    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

// R1.3：删除失效的 compileNative 任务（if(true) return false 永不执行）。
// native 构建/校验属于 openysm.cpp 仓库与 gradle/verify-native-abi.gradle，不在此处。
