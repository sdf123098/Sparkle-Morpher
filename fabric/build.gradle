plugins {
    id 'com.gradleup.shadow'
}
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
            if (!rootProject.ext.isCurseForgeDist) {
                srcDir rootProject.ext.distributionNativeJavaSourceDir
            }
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            exclude 'native/**'
        }
    }
    // R0: JVM 单测挂靠 fabric 模块，测试代码随核心代码放 common/src/test/java
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}


loom {
    accessWidenerPath = file('src/main/resources/sparkle_morpher.accesswidener')
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // @ExpectPlatform 注解来源（原由 architectury 插件间接提供，删 common 模块后需显式声明）
    compileOnly "dev.architectury:architectury-injectables:1.0.10"
    // Loom 1.14 + JDK21 源码重映射（Mercury）需要 javax.annotation；缺失会导致
    // cardinal-components 等依赖的 sources 重映射报 Pb(347) 并在配置阶段失败。
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // Optional at runtime. Used only to compile the TaCZ: Refabricated compatibility bridge.
    modCompileOnly "maven.modrinth:1j76DVHU:sqMweCpe"
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"

    modImplementation("dev.architectury:architectury-fabric:$rootProject.architectury_api_version") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    include "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    include "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"


    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    modCompileOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
    implementation "com.electronwill.night-config:core:3.9.0"
    implementation "com.electronwill.night-config:toml:3.9.0"

    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

}

processResources {
    def resourceModVersion = project.version.toString()
    inputs.property 'version', resourceModVersion

    filesMatching('fabric.mod.json') {
        expand version: resourceModVersion
    }
    from(rootProject.file('LICENSE.txt')) {
        rename { 'LICENSE' }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    if (rootProject.ext.isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-fa1.21.1")
}

apply from: rootProject.file('gradle/verify-distribution.gradle')


