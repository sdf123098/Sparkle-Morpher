plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = file('src/main/resources/sparkle_morpher.accesswidener')
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def releaseArchiveName = "${rootProject.archives_name}-${project.version}-fa26.2"

sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            exclude 'native/**'
        }
    }
    // R0: JVM 单测挂靠 fabric 模块，但测试代码随核心代码放 common/src/test/java，
    // 未来抽 spm-core 模块时测试自然跟随。
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

test {
    useJUnitPlatform()
}

if (rootProject.ext.isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('src/main/java'),
                fileTree(rootProject.file('common/src/main/java')) {
                    exclude 'com/micaftic/morpher/RuntimeAccelerationLoader.java'
                    exclude 'com/micaftic/morpher/client/gui/resource/ResourceStationConfig.java'
                    exclude 'com/elfmcys/yesstevemodel/geckolib3/geo/render/built/ModelAccelerationBridge.java'
                    exclude 'com/micaftic/morpher/util/ClientUiUtil.java'
                    exclude 'com/micaftic/morpher/util/PlatformUtil.java'
                    exclude 'com/ysm/parser/YSMParser.java'
                    exclude 'com/ysm/parser/YSMNative.java'
                    exclude 'com/micaftic/morpher/core/algorithms/YsmAlgorithmBridge.java'
                },
                fileTree(rootProject.file('common/src/curseforge/java'))
        )
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Ship optional renderer integrations as Fabric nested JARs. The compatibility implementation
    // stays in its own subproject/API entrypoint, while the primary distribution remains one file.
    include(project(path: ':caustica-compat', configuration: 'namedElements')) {
        transitive = false
    }

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"


    modImplementation "curse.maven:forge-config-api-port-547434:$rootProject.forge_config_api_port_curse_file_id"
    include "curse.maven:forge-config-api-port-547434:$rootProject.forge_config_api_port_curse_file_id"

    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"

    implementation "com.electronwill.night-config:core:3.9.0"
    implementation "com.electronwill.night-config:toml:3.9.0"

    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // zstd-jni dependency removed: project now uses YSM native �?pure-Java ZstdUtil �?raw-frame fallback chain.
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }

    if (rootProject.ext.isCurseForgeDist) {
        exclude 'natives/**'
        exclude '**/*.dll'
        exclude '**/*.so'
        exclude '**/*.dylib'
        exclude '**/*.jnilib'
        exclude '**/*.exe'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    archiveFileName = "${releaseArchiveName}-dev-shadow.jar"
    includeEmptyDirs = false
    eachFile { details ->
        def path = details.path
        if (path == 'com/micaftic/morpher/mixin/client/BufferSourceMixin.class') {
            details.exclude()
        }
        if (path.startsWith('net/minecraft/') &&
                path != 'net/minecraft/client/renderer/MultiBufferSource.class' &&
                path != 'net/minecraft/client/renderer/MultiBufferSource$BufferSource.class') {
            details.exclude()
        }
    }
}

remapJar {
    input.set shadowJar.archiveFile
    archiveFileName = rootProject.ext.isCurseForgeDist
            ? "${releaseArchiveName}-curseforge.jar"
            : "${releaseArchiveName}.jar"

    doLast {
        def bundledCompat = zipTree(archiveFile.get().asFile).matching {
            include 'META-INF/jars/sparkle-morpher-caustica-compat-*.jar'
        }.files
        if (bundledCompat.size() != 1) {
            throw new GradleException("Expected exactly one bundled Caustica compatibility JAR, found ${bundledCompat.size()}")
        }
    }
}

tasks.named('remapSourcesJar') {
    archiveFileName = "${releaseArchiveName}-sources.jar"
}

