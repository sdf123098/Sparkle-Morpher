plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = file('src/main/resources/sparkle_morpher.accesswidener')
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def releaseArchiveName = "${rootProject.archives_name}-${project.version}-fa26.2"

sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
            if (!rootProject.ext.isCurseForgeDist) {
                srcDir rootProject.ext.distributionNativeJavaSourceDir
            }
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            exclude 'native/**'
        }
    }
    // R0: JVM 单测挂靠 fabric 模块，但测试代码随核心代码放 common/src/test/java，
    // 未来抽 spm-core 模块时测试自然跟随。
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

test {
    useJUnitPlatform()
    // jdk.zipfs 不在默认 ALL-DEFAULT 解析集（java.se 闭包不含），.ysm 容器解析需要 jar: FileSystem
    jvmArgs "--add-modules", "jdk.zipfs"
}

if (rootProject.ext.isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('src/main/java'),
                fileTree(rootProject.file('common/src/main/java')),
                fileTree(rootProject.file('common/src/curseforge/java'))
        )
    }
}

// Public release artifacts are compile-only: TaCZ stays optional and is never bundled.
def taczReleases = [
        '26.1.2': ['26.1.2的mod文件_R3_HOTFIX-2', 'TACZ-Refabricated-26.1.2-1.1.8+fabric.26.1.2.R3-hotfix2'],
        '26.2': ['26.2_R3-HOTFIX-3', 'TACZ-Refabricated-26.2-1.1.8+fabric.26.2.R3-hotfix3'],
        '26.3': ['26.3_R1_HOTFIX', 'TACZ-Refabricated-26.3-1.1.8+fabric.26.3.R1-hotfix']
]
def taczRelease = taczReleases[rootProject.minecraft_version]
repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'TaCZRefabricatedReleases'
                url = 'https://github.com/q14433686-arch/TaCZ_Refabricated_Unofficial/releases/download'
                patternLayout { artifact '[revision]/[artifact].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'tacz-refabricated' }
    }
}

dependencies {
    // Loom 1.17 for unobfuscated 26.3 uses the standard compileOnly configuration.
    add(configurations.findByName('modCompileOnly') == null ? 'compileOnly' : 'modCompileOnly',
            "tacz-refabricated:${taczRelease[1]}:${taczRelease[0]}@jar") { transitive = false }
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Ship optional renderer integrations as Fabric nested JARs. The compatibility implementation
    // stays in its own subproject/API entrypoint, while the primary distribution remains one file.
    include(project(path: ':caustica-compat', configuration: 'namedElements')) {
        transitive = false
    }

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"


    modImplementation "curse.maven:forge-config-api-port-547434:$rootProject.forge_config_api_port_curse_file_id"
    include "curse.maven:forge-config-api-port-547434:$rootProject.forge_config_api_port_curse_file_id"


    implementation "com.electronwill.night-config:core:3.9.0"
    implementation "com.electronwill.night-config:toml:3.9.0"

    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // zstd-jni dependency removed: project now uses YSM native �?pure-Java ZstdUtil �?raw-frame fallback chain.
}

processResources {
    def resourceModVersion = project.version.toString()
    inputs.property 'version', resourceModVersion

    filesMatching('fabric.mod.json') {
        expand version: resourceModVersion
    }

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }

    if (rootProject.ext.isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    archiveFileName = "${releaseArchiveName}-dev-shadow.jar"
    includeEmptyDirs = false
    eachFile { details ->
        if (details.path.startsWith('net/minecraft/')) {
            details.exclude()
        }
    }
}

remapJar {
    input.set shadowJar.archiveFile
    archiveFileName = rootProject.ext.distributionArchiveName(releaseArchiveName)

    doLast {
        List<String> bundledCompat = []
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name ==~ /META-INF\/jars\/sparkle-morpher-caustica-compat-[^\/]*\.jar/) {
                    bundledCompat.add(entry.name)
                }
            }
        }
        if (bundledCompat.size() != 1) {
            throw new GradleException("Expected exactly one bundled Caustica compatibility JAR, found ${bundledCompat.size()}")
        }
    }
}

tasks.named('remapSourcesJar') {
    archiveFileName = "${releaseArchiveName}-sources.jar"
}

apply from: rootProject.file('gradle/verify-distribution.gradle')

