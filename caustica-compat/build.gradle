base {
    archivesName = 'sparkle-morpher-caustica-compat'
}

def releaseArchiveName = "sparkle-morpher-caustica-compat-${project.version}-fa26.3"

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    def devJar = providers.gradleProperty('sparkleMorpherDevJar').orNull
    if (devJar != null && !devJar.isBlank()) {
        compileOnly files(devJar)
    } else {
        compileOnly(project(path: ':fabric')) { transitive = false }
    }
}

processResources {
    def resourceModVersion = project.version.toString()
    inputs.property 'version', resourceModVersion
    filesMatching('fabric.mod.json') {
        expand version: resourceModVersion
    }
}

jar {
    archiveClassifier = 'dev'
    archiveFileName = "${releaseArchiveName}-dev.jar"
}

tasks.named('jar', Jar) {
    archiveClassifier = null
    archiveFileName = rootProject.ext.distributionArchiveName(releaseArchiveName)
}
